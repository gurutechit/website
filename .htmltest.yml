# htmltest configuration
# https://github.com/wjdp/htmltest

# Ignore empty hash links (href="#") - common in templates for UI elements
IgnoreInternalEmptyHash: true

# Check internal links
CheckInternal: true

# Check external links
CheckExternal: true

# Check mailto links format
CheckMailto: true

# Check tel links format
CheckTel: true

# Check favicon exists
CheckFavicon: true

# Check meta refresh tags
CheckMetaRefresh: true

# Timeout for external link checks (seconds)
ExternalTimeout: 15

# Ignore URLs matching these patterns
IgnoreURLs:
  - "^https://fonts.googleapis.com"
  - "^https://fonts.gstatic.com"
  # Ignore localhost examples in articles
  - "^http://127.0.0.1"
  # Ignore theme assets - they won't exist until deployment
  - "^https://www.gurutech.it/theme/"
  # Ignore internal pages checked as external URLs - they may not exist until deployment
  - "^https://www.gurutech.it/pages/"
  # Ignore self-referential Pelican-generated links that won't exist until deployment
  - "^https://www.gurutech.it/category/"
  - "^https://www.gurutech.it/tag/"
  - "^https://www.gurutech.it/author/"
  - "^https://www.gurutech.it/[^/]+\\.html$"

# Ignore missing alt attributes (Pelican may generate some images without)
IgnoreAltMissing: false

# Output directory (passed via CLI)
# DirectoryPath: output/

# Cache external link results
CacheExpires: "6h"
